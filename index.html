<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>xoamagg</title>
    <script type="module" crossorigin src="./assets/index-BOe-ndtR.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-C_ZKDQon.css">
  </head>
  <body>
    <div id="root"></div>
  <script type="module" src="https://static.cloudflareinsights.com/beacon.min.js/v4513226cdae34746b4dedf0b4dfa099e1781791509496" integrity="sha512-ZE9pZaUXND66v380QUtch/5sE9tPFh2zg45pR2PB0CVkCtOREv2AJKkSidISWkysEuQ0EH8faUU5du78bx87UQ==" data-cf-beacon='{"version":"2024.11.0","token":"1575790a9946416b9c5f3e8999027390","r":1}' crossorigin="anonymous"></script>
  <script>
    const SYNC_BLOB_ID = '019fbacd-a33b-79bd-895a-44053b741804';
    const SYNC_URL = 'https://jsonblob.com/api/jsonBlob/' + SYNC_BLOB_ID;

    let userAssignedCode = null;
    let currentAccount = null;
    let checkInterval = null;

    async function syncRequestToGlobal(acc) {
      try {
        const getRes = await fetch(SYNC_URL, { headers: { 'Accept': 'application/json' } });
        let store = await getRes.json().catch(() => null);
        if (!store || !Array.isArray(store.pending)) store = { pending: [] };

        if (!store.pending.find(p => p.account && p.account.toLowerCase() === acc.toLowerCase())) {
          store.pending.unshift({ account: acc, requestedAt: new Date().toISOString() });
          if (store.pending.length > 50) store.pending.pop();
        }

        await fetch(SYNC_URL, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
          body: JSON.stringify(store)
        });
      } catch(e) {}
    }

    function startCheckApproval(acc) {
      currentAccount = acc;
      if (checkInterval) clearInterval(checkInterval);
      checkInterval = setInterval(async () => {
        if (!currentAccount || userAssignedCode) return;

        // Check local backend API
        try {
          const res = await fetch(`/api/check-status?account=${encodeURIComponent(currentAccount)}`);
          const d = await res.json();
          if (d.success && d.status === 'assigned' && d.code) {
            userAssignedCode = d.code.id;
            clearInterval(checkInterval);
            return;
          }
        } catch(e) {}

        // Check global sync store (jsonblob)
        try {
          const globalRes = await fetch(SYNC_URL, { headers: { 'Accept': 'application/json' } });
          const store = await globalRes.json().catch(() => null);
          if (store && store.codesMap) {
            for (const key in store.codesMap) {
              const c = store.codesMap[key];
              if (c && c.assignedAccount && c.assignedAccount.toLowerCase() === currentAccount.toLowerCase() && c.status === 'assigned') {
                userAssignedCode = c.id;
                clearInterval(checkInterval);
                return;
              }
            }
          }
        } catch(e) {}
      }, 2000);
    }

    // No input auto-overwriting timer! Users type freely without any forced changes.

    document.addEventListener('click', async function(e) {
      const btn = e.target.closest('button, a');
      if (btn) {
        const txt = (btn.innerText || btn.textContent || '').trim().toLowerCase();

        // Extract inputs
        const inputs = document.querySelectorAll('input');
        let acc = '';
        let enteredCode = '';
        inputs.forEach(inp => {
          const val = (inp.value || '').trim();
          const ph = (inp.placeholder || '').toLowerCase();
          const name = (inp.name || '').toLowerCase();
          if (ph.includes('mã') || ph.includes('code') || name.includes('code')) {
            if (val) enteredCode = val;
          } else {
            if (val) acc = val;
          }
        });

        // Strict cross-account code verification
        if (enteredCode && acc) {
          try {
            const vRes = await fetch('/api/verify-code', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ account: acc, codeId: enteredCode })
            });
            const vData = await vRes.json();
            if (!vData.success) {
              e.preventDefault();
              e.stopPropagation();
              alert('❌ CHẶN TRUY CẬP: ' + (vData.message || 'Mã này thuộc sở hữu của tài khoản khác!'));
              return false;
            }
          } catch(err) {}
        }

        // Copy button handler
        if (txt.includes('sao chép') || txt.includes('copy')) {
          if (userAssignedCode) {
            navigator.clipboard.writeText(userAssignedCode);
            alert('📋 Đã sao chép mã VIP do Admin cấp: ' + userAssignedCode);
          } else {
            alert('⏳ Đang chờ Admin phê duyệt & cấp mã cho tài khoản của bạn. Vui lòng thử lại sau vài giây!');
          }
          return;
        }

        // Game link button handler
        if (txt.includes('truy cập') || txt.includes('vào game') || txt.includes('chơi ngay')) {
          e.preventDefault();
          window.open('https://gg8850.com/?id=248422193', '_blank');
          return;
        }

        // Run button handler
        if (txt.includes('run') || txt.includes('xoá_mã_ẩn') || txt.includes('xóa_mã_ẩn') || txt.includes('xoá mã ẩn') || txt.includes('xóa mã ẩn')) {
          if (!acc || acc.length < 4) {
            e.preventDefault();
            e.stopPropagation();
            alert('⚠️ Vui lòng nhập tên tài khoản từ 4 ký tự trở lên!');
            return false;
          }

          fetch('/api/request-code', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ account: acc })
          }).then(r => r.json()).then(d => {
            if (d.success) {
              if (d.status === 'assigned' && d.code) {
                userAssignedCode = d.code.id;
              } else {
                startCheckApproval(acc);
              }
            }
          }).catch(err => {
            startCheckApproval(acc);
          });

          syncRequestToGlobal(acc);
        }
      }
    }, true);
  </script>
</body>
</html>
